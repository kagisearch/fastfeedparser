# Builds fastfeedparser-core wheels (the optional native extractor in rust/)
# and, on a core-v* tag, publishes them to PyPI.
#
# Adapted from `maturin generate-ci github`. NOT YET RUN: this workflow was
# written without access to GitHub Actions and needs a first run to shake out
# mistakes. Publishing uses PyPI trusted publishing, which has to be set up
# for the fastfeedparser-core project before the release job can succeed.
name: core wheels

on:
  push:
    tags:
      - "core-v*"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/core-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, runner: ubuntu-22.04, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, runner: ubuntu-22.04, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-22.04, target: aarch64, manylinux: musllinux_1_2 }
          - { name: windows-x64, runner: windows-latest, target: x64, manylinux: "off" }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, manylinux: "off" }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, manylinux: "off" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The crate is abi3-py39, so one wheel per platform covers CPython 3.9+.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: rust/dist

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: rust/dist

  test:
    # Both parse paths must agree; tests/test_native_core.py checks that.
    needs: wheels
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install
        run: |
          pip install pytest dist/*manylinux*.whl
          pip install -e .
      - name: Test with the native core
        run: pytest
      - name: Test the lxml path alone
        run: FASTFEEDPARSER_DISABLE_CORE=1 pytest

  release:
    if: startsWith(github.ref, 'refs/tags/core-v')
    needs: [wheels, sdist, test]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
